<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="Explore Sudhanshu Bhardwaj's portfolio and customize its color palette.">
  <title>My Web | Portfolio</title>
  <style>
    :root { color-scheme: dark; --bg: #07111f; --panel: #0d1b2a; --text: #edf4ff; --muted: #b5c6d9; --primary: #72e2ff; --secondary: #8b5cf6; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 28px 18px; display: grid; place-items: center; color: var(--text); font: 16px/1.6 Inter, system-ui, sans-serif; background: radial-gradient(circle at 15% 10%, #12334d, transparent 38%), radial-gradient(circle at 85% 85%, #28204b, transparent 35%), var(--bg); }
    main { width: min(100%, 900px); }
    .card { padding: clamp(24px, 6vw, 56px); border: 1px solid rgb(255 255 255 / 12%); border-radius: 28px; background: rgb(13 27 42 / 88%); box-shadow: 0 24px 70px rgb(0 0 0 / 30%); }
    .eyebrow { color: var(--primary); font-size: .8rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: clamp(2.5rem, 8vw, 5rem); line-height: 1; letter-spacing: -.06em; }
    h1 span { color: var(--primary); }
    p { max-width: 620px; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .button { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 11px 18px; border: 1px solid rgb(255 255 255 / 17%); border-radius: 14px; color: var(--text); background: rgb(255 255 255 / 5%); text-decoration: none; font-weight: 700; transition: transform .18s ease, background .18s ease; }
    .button:hover { transform: translateY(-2px); background: rgb(255 255 255 / 11%); }
    .button.primary { border-color: transparent; color: #07111f; background: linear-gradient(120deg, var(--primary), #4ec8ff 45%, var(--secondary)); }
    .note { margin-top: 26px; font-size: .9rem; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <div class="eyebrow">Sudhanshu Bhardwaj · Personal website</div>
      <h1>My <span>Web</span></h1>
      <p>A home for my portfolio, projects, and experiments. Visit the portfolio or open the color picker to customize its palette.</p>
      <div class="actions">
        <a class="button primary" href="index.html">View portfolio</a>
        <a class="button" href="https://subi003.github.io/My_Web/#contact">Contact</a>
        <a class="button" href="color-picker.html">Open color picker</a>
        <a class="button" href="https://github.com/Subi003" target="_blank" rel="noopener noreferrer">GitHub profile</a>
      </div>
      <p class="note">Tip: the color picker saves your palette in this browser.</p>
    </section>
  </main>
</body>
</html>
