<svg width="360" height="360" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SB monogram logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfe9ff"/>
      <stop offset="100%" stop-color="#ccd9ff"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf1ff"/>
      <stop offset="100%" stop-color="#dfe9ff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#8aa5d8" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="22" y="22" width="316" height="316" rx="58" fill="url(#bgGrad)" filter="url(#softShadow)"/>
  <rect x="34" y="34" width="292" height="292" rx="48" fill="url(#innerGrad)" stroke="#9bb0d6" stroke-opacity="0.28" stroke-width="2"/>

  <text
    x="180"
    y="215"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-size="154"
    font-weight="900"
    letter-spacing="-12"
    fill="#171d2a"
  >SB</text>
</svg>
